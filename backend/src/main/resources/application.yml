
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finsight
    username: finsight
    password: "Yash@2004"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
finsight:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 900000